name: Native macOS arm64 recovery proof

on:
  push:
    branches: [codex/macos-native-proof-20261106]

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'pappdavid/agent-cli-mcp-rust'
    runs-on: macos-15
    timeout-minutes: 18
    steps:
      - name: Checkout reviewed public source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 0059a7bbc5017be92c1dc46633a543fe95c89bea
          persist-credentials: false

      - name: Build and record provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          test "$(git rev-parse HEAD)" = 0059a7bbc5017be92c1dc46633a543fe95c89bea
          CARGO_NET_RETRY=1 CARGO_INCREMENTAL=0 cargo build --locked --release
          mkdir -p output
          cp target/release/agent-cli-mcp-rust output/
          {
            printf 'source_commit=%s\n' "$(git rev-parse HEAD)"
            printf 'workflow_run=%s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf 'runner_arch=%s\n' "$(uname -m)"
            printf 'runner_image=%s %s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
            rustc --version --verbose
            cargo --version
            shasum -a 256 Cargo.lock
            file output/agent-cli-mcp-rust
          } > output/PROVENANCE.txt
          (cd output && shasum -a 256 agent-cli-mcp-rust > SHA256SUMS)
          cat output/PROVENANCE.txt output/SHA256SUMS
          tar -C output -czf native-macos-arm64.tar.gz agent-cli-mcp-rust PROVENANCE.txt SHA256SUMS

