name: Rust Autofix

on:
  push:
    branches: [repair/verified-build]

permissions:
  contents: write

jobs:
  autofix:
    if: ${{ !contains(github.event.head_commit.message, '[skip-autofix]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: repair/verified-build
          fetch-depth: 0

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply machine-safe Clippy fixes
        run: cargo clippy --fix --allow-dirty --allow-staged --all-targets -- -D warnings || true

      - name: Apply rustfmt
        run: cargo fmt --all

      - name: Commit mechanical changes
        run: |
          if git diff --quiet; then
            echo "No automatic changes available"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src Cargo.toml Cargo.lock
          git commit -m "style: apply safe Rust fixes [skip-autofix]"
          git push origin HEAD:repair/verified-build
